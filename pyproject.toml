[project]
name = "queen-board"
version = "1.0.0"
description = "Play chess against Princeton's QUEEN model and see it explain its moves (unofficial)"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "chess>=1.11,<2",
    "huggingface-hub>=1.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

# Tested with Python 3.10-3.12, PyTorch 2.14, transformers 5.20. Upper bounds stop a
# future major version from silently breaking QUEEN's bridge layers.

[project.optional-dependencies]
# Everything needed to run QUEEN on this machine (leave out to use QUEEN running elsewhere).
torch = ["torch>=2.6,<3", "transformers>=5.0,<6", "accelerate>=1.0,<2", "safetensors>=0.4,<1"]
quant = ["bitsandbytes>=0.45,<1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
queen = "queen_portable.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license fields
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["queen_portable*"]
