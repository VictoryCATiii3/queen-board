[project]
name = "queen-board"
version = "0.4.0"
description = "Play chess against Princeton's QUEEN model and see it explain its moves (unofficial)"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "chess>=1.11",
    "huggingface-hub>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Everything needed to run QUEEN on this machine (leave out to use QUEEN running elsewhere).
torch = ["torch>=2.6", "transformers>=5.0", "accelerate>=1.0", "safetensors"]
quant = ["bitsandbytes>=0.45"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
queen = "queen_portable.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["queen_portable*"]
