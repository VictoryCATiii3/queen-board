<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queen Board</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="layout">
  <section class="board-col">
    <div class="player-tag" id="tag-top"></div>
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 800 800" aria-label="Chess board"></svg>
      <div id="promo" class="promo hidden"></div>
    </div>
    <div class="player-tag" id="tag-bottom"></div>
    <div id="status" class="status">Loading…</div>
  </section>

  <aside class="panel">
    <header class="brand">
      <span class="crown">♛</span>
      <div>
        <h1>Queen Board</h1>
        <p>play · ask · learn</p>
      </div>
    </header>

    <div class="card">
      <h2>Game</h2>
      <label>Opponent
        <select id="opp">
          <option value="hotseat">Nobody — play both sides</option>
          <option value="random">Random mover</option>
          <option value="stockfish">Stockfish</option>
          <option value="queen">Queen 4B</option>
        </select>
      </label>
      <div class="row">
        <label>You play
          <select id="color">
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </label>
        <label id="skill-wrap">Stockfish level
          <input id="skill" type="number" min="0" max="20" value="20">
        </label>
      </div>
      <div id="pending" class="pending hidden">Press <b>New game</b> to switch to this opponent. The current game continues until you do.</div>
      <div class="row buttons">
        <button id="new" class="primary">New game</button>
        <button id="undo">Undo</button>
        <button id="flip">Flip</button>
      </div>
      <details>
        <summary>Start from a position (FEN)</summary>
        <input id="fen" placeholder="paste a FEN, then New game">
      </details>
    </div>

    <div class="card">
      <h2>Ask</h2>
      <div class="row">
        <select id="an-engine">
          <option value="stockfish">Stockfish</option>
          <option value="queen">Queen 4B</option>
        </select>
        <button id="analyze" class="primary">Analyze position</button>
      </div>
      <input id="question" placeholder="Optional: why not Nf3? what's the threat?">
      <div id="analysis" class="analysis empty">Ask an engine about the current position. Its best move and line are drawn as arrows.</div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <ol id="moves" class="moves"></ol>
      <div class="row buttons">
        <button id="copy-pgn">Copy PGN</button>
        <button id="copy-fen">Copy FEN</button>
      </div>
    </div>
  </aside>
</main>
<script src="/static/board.js"></script>
</body>
</html>
