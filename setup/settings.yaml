# Queen Board settings
# ---------------------------------------------------------------------------
# Edit a value, save, and run the launcher again. Lines starting with # are notes.
# Leave a value blank to use the default.
#
# A setting given on the command line (e.g. PORT=8080 ./queen_runner_linux.sh)
# wins over this file for that one run.

# --- Where QUEEN runs --------------------------------------------------------

# true  = run QUEEN on the CPU. Works on any computer with ~10 GB of free memory,
#         but is very slow (each QUEEN move can take many minutes).
# false = use the graphics chip: NVIDIA (CUDA) on Linux/Windows, Apple GPU on Macs.
#         Falls back to the CPU automatically if neither is available.
cpu: false

# Which QUEEN checkpoint: pawn-8 (stronger, default) or hce-4.
model: pawn-8

# Shrink QUEEN to fit smaller NVIDIA GPUs: int8 or nf4. NVIDIA only.
# Blank = automatic: nf4 is used on its own for GPUs with 5.5-10 GB.
quantize:

# Where to download QUEEN (~8.4 GB). Blank = the standard Hugging Face folder
# in your home directory. Example for an external drive on a Mac:
#   download_folder: /Volumes/MyDrive/huggingface
download_folder:

# Use a QUEEN folder you already downloaded instead (contains xattn.pt).
model_folder:

# Use QUEEN running on another computer, e.g. http://192.168.1.50:8765
# (start it there with:  .venv/bin/queen serve --host 0.0.0.0)
queen_url:

# --- The board -----------------------------------------------------------------

# Web address port: the board opens at http://127.0.0.1:<port>
port: 8000

# Open the browser automatically when the board starts.
open_browser: true

# Save every game (each move, who played it, and what the engines said) to games/.
save_games: true

# Seconds Stockfish thinks per move.
stockfish_time: 0.5
